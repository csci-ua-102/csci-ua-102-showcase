<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Structures — Fall 2026 Project Showcase</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bg"></canvas>

<div class="wrap">
  <header class="top">
    <div class="kicker">CSCI-UA 102 · Data Structures</div>
    <h1>Fall 2026 Project Showcase</h1>
  </header>

  <div class="panel">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Team</th>
            <th>Description</th>
            <th>Link</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="add-section">
      <h2>Add your team</h2>
      <label>Team name</label>
      <input id="a-team">

      <label>Members</label>
      <div id="a-members-rows"></div>
      <button type="button" class="mini" id="a-add-member">+ Add member</button>

      <label>Description</label>
      <input id="a-desc">

      <label>Link</label>
      <input id="a-link">

      <button class="add-btn" id="a-submit">Submit</button>
      <div class="add-msg" id="a-msg"></div>
      <div class="add-note">Submissions can't be edited afterward — double check before submitting. Need a correction? Ask your TA.</div>
    </div>
  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
