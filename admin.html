<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add a submission — CSCI-UA 102 Showcase (admin)</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="tsparticles-bg"></div>
<div id="corner-splatter" class="bg-blend-img" style="background-image:url('top-left-img.png');"></div>
<div id="side-explosion" class="bg-blend-img" style="background-image:url('bg-explosion.png');"></div>

<div class="wrap">
  <header class="top">
    <div class="kicker">CSCI-UA 102 · Data Structures</div>
    <h1>Add a submission</h1>
  </header>

  <div class="panel">
    <div class="add-section">
      <h2>From a Form response</h2>
      <label>Team name</label>
      <input id="a-team">

      <label>Members</label>
      <div id="a-members-rows"></div>
      <button type="button" class="mini" id="a-add-member">+ Add member</button>

      <label>Description</label>
      <input id="a-desc">

      <label>Link</label>
      <input id="a-link">

      <button class="add-btn" id="a-submit">Submit</button>
      <div class="add-msg" id="a-msg"></div>
      <div class="add-note">This page isn't linked from the public site — bookmark it. Entries are immutable once added; double-check before submitting.</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tsparticles/engine@4/tsparticles.engine.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tsparticles@4/tsparticles.bundle.min.js"></script>
<script src="particles-config.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
